# Builds this keymap with the workflow in ned-si/qmk-userspace, from this
# commit. On pushes to main it also redraws the README layer diagrams and
# publishes the firmware as a release tagged with the commit SHA (the newest is
# always at /releases/latest).
name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ned-si/qmk-userspace/.github/workflows/build.yml@main
    with:
      keymap_repo: ${{ github.repository }}
      keymap_ref: ${{ github.event.pull_request.head.sha || github.sha }}
